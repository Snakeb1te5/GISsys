        function findNearestHydrantSmart(startLatLng, hydrantList, maxCandidates = 10) {
            // 1. Вычисляем прямое расстояние до каждого гидранта
            const sortedHydrants = hydrantList.map(marker => {
                const latlng = marker.getLatLng();
                return {
                    marker: marker,
                    latlng: latlng,
                    distance: startLatLng.distanceTo(latlng)
                };
            }).sort((a, b) => a.distance - b.distance);

            
            const candidates = sortedHydrants.slice(0, maxCandidates);

            let shortest = null;
            let minRouteDistance = Infinity;
            let completed = 0;

            candidates.forEach(candidate => {
                L.Routing.osrmv1().route([
                    L.Routing.waypoint(startLatLng),
                    L.Routing.waypoint(candidate.latlng)
                ], function(err, routes) {
                    completed++;

                    if (!err && routes && routes[0]) {
                        const routeDistance = routes[0].summary.totalDistance;

                        if (routeDistance < minRouteDistance) {
                            minRouteDistance = routeDistance;
                            shortest = {
                                marker: candidate.marker,
                                route: routes[0]
                            };
                        }
                    }

                    
                    if (completed === candidates.length && shortest) {
                        if (routingControl) {
                            myMap.removeControl(routingControl);
                        }

                        routingControl = L.Routing.control({
                            waypoints: [startLatLng, shortest.marker.getLatLng()],
                            routeWhileDragging: false,
                            language: 'ru'
                        }).addTo(myMap);

                        

                        
                        L.popup()
                            .setLatLng(shortest.marker.getLatLng())
                            .setContent(`<b>Ближайший гидрант</b><br>Расстояние: ${(minRouteDistance / 1000).toFixed(2)} км`)
                            .openOn(myMap);
                    }
                });
            });
        }
